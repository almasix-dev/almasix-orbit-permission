[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-orbit-permission"
version = "0.1.0"
description = "Orbit plugin — Users, Roles, and Permissions UI on almasix-permission"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
readme = "README.md"
dependencies = [
    "almasix-orbit>=0.4.1",
    "almasix-permission>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff==0.16.6",
]

[project.entry-points."almasix.providers"]
orbit_permission = "almasix_orbit_permission.provider:OrbitPermissionProvider"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-orbit-permission"
Documentation = "https://orbit.almasix.com/plugins/orbit-permission/"
Repository = "https://github.com/almasix-dev/almasix-orbit-permission"
Issues = "https://github.com/almasix-dev/almasix-orbit-permission/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix_orbit_permission"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/almasix_orbit_permission",
    "/tests",
    "/examples",
    "/marketplace",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["almasix_orbit_permission"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "B017", "B018"]
